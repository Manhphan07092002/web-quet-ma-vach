<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập - SmartAdmin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #0f172a 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.35);
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
      background: rgba(15, 23, 42, 0.9);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--primary-hover), #4f46e5);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .quick-accounts {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .quick-accounts-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      text-align: center;
    }

    .quick-pills {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quick-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .quick-pill:hover {
      background: rgba(79, 70, 229, 0.2);
      border-color: rgba(79, 70, 229, 0.4);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      </div>
      <h1>SmartAdmin</h1>
      <p>Hệ thống Quản lý Kho & Kiểm kê Mã Vạch</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="usernameInput">Tên đăng nhập</label>
        <div class="input-wrapper">
          <input type="text" id="usernameInput" placeholder="admin / qlkho / nvkho1..." required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Mật khẩu / Mã PIN</label>
        <div class="input-wrapper">
          <input type="password" id="passwordInput" placeholder="••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        Đăng nhập Hệ thống 🚀
      </button>
    </form>

    <div class="quick-accounts">
      <div class="quick-accounts-title">CHỌN NHANH TÀI KHOẢN MẪU</div>
      <div class="quick-pills">
        <div class="quick-pill" onclick="fillAccount('admin', '1234')">
          <span>👑 <b>admin</b> (Quản trị viên)</span>
          <span style="font-family: monospace; color: #818cf8;">PIN: 1234</span>
        </div>
        <div class="quick-pill" onclick="fillAccount('qlkho', '1234')">
          <span>🏢 <b>qlkho</b> (Quản lý kho)</span>
          <span style="font-family: monospace; color: #818cf8;">PIN: 1234</span>
        </div>
        <div class="quick-pill" onclick="fillAccount('nvkho1', '1234')">
          <span>📱 <b>nvkho1</b> (Nhân viên ca 1)</span>
          <span style="font-family: monospace; color: #818cf8;">PIN: 1234</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fillAccount(u, p) {
      document.getElementById('usernameInput').value = u;
      document.getElementById('passwordInput').value = p;
      document.getElementById('passwordInput').focus();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Đang xác thực...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
          if (data.user.role === 'scanner') {
            btn.disabled = false;
            btn.textContent = 'Đăng nhập Hệ thống 🚀';
            Swal.fire({
              icon: 'warning',
              title: 'Không có quyền Quản trị',
              html: `Tài khoản <b>${data.user.fullName || data.user.full_name}</b> (@${data.user.username}) là <b>Nhân viên quét kho</b>.<br><br>Vui lòng đăng nhập trên ứng dụng quét di động <b>(Mobile Client)</b> hoặc sử dụng tài khoản <b>Quản lý / Admin</b> để vào trang Quản trị!`,
              confirmButtonText: 'Đã hiểu'
            });
            return;
          }

          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', JSON.stringify(data.user));
          localStorage.setItem('scannerUserName', data.user.fullName || data.user.full_name);

          Swal.fire({
            icon: 'success',
            title: 'Đăng nhập thành công!',
            text: `Chào mừng ${data.user.fullName || data.user.full_name} (${data.user.role === 'admin' ? '👑 Quản trị viên' : '🏢 Quản lý kho'})`,
            timer: 1300,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'index.html';
          });
        } else {
          Swal.fire('Lỗi đăng nhập', data.message || 'Sai tên đăng nhập hoặc mật khẩu', 'error');
          btn.disabled = false;
          btn.textContent = 'Đăng nhập Hệ thống 🚀';
        }
      } catch (err) {
        Swal.fire('Lỗi mạng', 'Không thể kết nối đến máy chủ: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Đăng nhập Hệ thống 🚀';
      }
    }
  </script>
</body>
</html>
