version: '3.8'

services:
  barcode-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-barcode-scanner
    restart: unless-stopped
    ports:
      - "3500:3500"   # Trang Quản trị Admin Dashboard & REST API
      - "3031:3031"   # Ứng dụng Quét mã Mobile Client (HTTPS)
    environment:
      - NODE_ENV=production
      - PORT=3500
      - HTTPS_PORT=3031
    volumes:
      # Lưu trữ bền vững dữ liệu SQLite và thư mục ảnh chụp
      - ./server/sqlite.db:/app/server/sqlite.db
      - ./server/uploads:/app/server/uploads
      # Lưu giữ chứng chỉ SSL tự ký
      - ./server/key.pem:/app/server/key.pem
      - ./server/cert.pem:/app/server/cert.pem
